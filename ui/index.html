<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search auction simulator</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./studio.css">
<link rel="license" href="./fonts/OFL-bricolage-grotesque.txt">
<link rel="license" href="./fonts/OFL-instrument-sans.txt">
</head>
<body>

<header class="bar">
  <div class="identity">
    <strong id="brand">—</strong>
    <span id="position" class="muted">—</span>
  </div>
  <div class="round-nav">
    <span id="round-label" class="muted">round —</span>
    <button id="playtest" class="ghost" type="button" hidden>Send playtest file</button>
    <button id="guide" class="ghost guide-open" type="button" aria-haspopup="dialog" aria-controls="field-guide" hidden><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h4a2 2 0 0 1 2 2v7a1.5 1.5 0 0 0-1.5-1.5h-4.5z"></path><path d="M13.5 3.5h-4a2 2 0 0 0-2 2v7a1.5 1.5 0 0 1 1.5-1.5h4.5z"></path></svg><span>Field guide</span></button>
    <button id="redo" class="ghost" type="button" hidden>Redo round 0</button>
    <button id="next" type="button" hidden>Run the week</button>
  </div>
</header>

<main id="app">
  <p class="loading">starting a game…</p>
</main>

<template id="tpl-dashboard">
  <section class="grid">

    <!-- Headline numbers ------------------------------------------------- -->
    <article class="card span-2" data-slot="headline">
      <h2>The week</h2>
      <div class="figures" data-slot="figures"></div>
      <p class="note" data-slot="settled"></p>
    </article>

    <!-- Where the impressions went. F12: share alone is misleading. -------- -->
    <article class="card span-2" data-slot="share">
      <h2>Where the impressions went</h2>
      <div class="bars" data-slot="share-bars"></div>
      <table class="mini" data-slot="positions"></table>
      <p class="note">
        Impression share says how often you <em>appeared</em>. It says nothing
        about what appearing cost — a rival who never outranks you still raises
        every click you buy.
      </p>
    </article>

    <!-- Where the money came from, and where it went back (G4).
         FULL WIDTH, and it has to be. Seven columns, the last holding five bid
         chips that are 297px of the 730 the table needs. At span-2 the card is
         683px at its widest — `main` caps at 1500 — so the table overflowed by
         47px on a 1920 screen and 140px on a 1280 one, and `.card` does not
         clip, so `+100%` was drawn on top of the card beside it. Tightening
         every gap in the card recovers 79px, which is not enough below 1440.
         Width is also what the first column needs: "Where" was squeezed to 58px
         and is 261px here, which is the difference between reading "Smaller
         cities and towns" and its example cities and not. --------------------->
    <article class="card span-4" data-slot="places">
      <h2>Where you advertise <span class="muted">the same click is worth different money in different places</span></h2>
      <div class="scroll-x"><table class="mini" data-slot="places-table"></table></div>
      <p class="note" data-slot="places-note"></p>
    </article>

    <!-- I31: the cost that has a lever and had nowhere to be watched. ------ -->
    <article class="card span-2" data-slot="returns">
      <h2>What came back <span class="muted">and what it cost to carry</span></h2>
      <div class="figures" data-slot="returns-figures"></div>
      <div data-slot="returns-weeks"></div>
      <p class="note" data-slot="returns-note"></p>
    </article>

    <!-- W11: numbers move after you have read them. ----------------------- -->
    <article class="card span-2" data-slot="revised">
      <h2>Changed since you looked</h2>
      <div data-slot="revised-body"></div>
    </article>

    <!-- 8.2 / 15.2: the only tool for writing negatives. ------------------ -->
    <article class="card span-2" data-slot="terms">
      <h2>Search terms <span class="muted">what your keywords actually matched</span></h2>
      <div class="range" data-slot="terms-range"></div>
      <div class="scroll"><table class="terms" data-slot="terms-table"></table></div>
      <p class="note" data-slot="terms-note"></p>
    </article>

    <!-- I33: your own running total against the week-8 deadline. Beside the
         search terms card, which sat alone with 685px of empty row. R3 is NOT
         lifted here: nothing on it is anybody else's figure. ----------------->
    <article class="card span-2" data-slot="deadline">
      <h2>What week 8 decides <span class="muted">and what it is worth</span></h2>
      <div class="figures" data-slot="deadline-figures"></div>
      <table class="mini" data-slot="deadline-ladder"></table>
      <p class="note" data-slot="deadline-note"></p>
    </article>

    <!-- Slice three: what you change between weeks. Replaced by the decision
         form, which owns its own cards so they sit in this grid. -->
    <div data-slot="decisions"></div>

    <article class="card span-2" data-slot="insights">
      <h2>Auction insights</h2>
      <table class="mini" data-slot="insights-table"></table>
      <p class="note">
        Overlap rate is how often a rival appeared in auctions you appeared in.
        It is not market share and it is not spend.
      </p>
    </article>

    <div data-slot="trends"></div>

    <article class="card span-2" data-slot="budget">
      <h2>Budget</h2>
      <div data-slot="budget-body"></div>
    </article>

    <article class="card span-2" data-slot="market">
      <h2>The market</h2>
      <table class="mini" data-slot="market-table"></table>
    </article>

  </section>
</template>

<script type="module" src="./app.js"></script>
</body>
</html>
