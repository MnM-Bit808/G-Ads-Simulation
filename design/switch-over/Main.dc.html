<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&display=swap">
  <style>
    body { margin: 0; }
    .num { font-variant-numeric: tabular-nums; }
    .display { font-family: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif; }
    .pick { cursor: pointer; user-select: none; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; background: #0D0C0E; color: #EDE8E3; font-family: 'Instrument Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden;">
  <div style="position: absolute; top: 14px; left: 16px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; color: #8A847E;">
    <div>mock-up, show:</div>
    <sc-for list="{{states}}" as="s" hint-placeholder-count="5"><div class="pick" onClick="{{s.pick}}" style="padding: 3px 10px; border: 1px solid {{s.border}}; border-radius: 999px; color: {{s.color}};">{{s.label}}</div></sc-for>
  </div>
  <div style="width: 600px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="display" style="width: 44px; height: 44px; border-radius: 14px; background: #D7262F; color: #FFF5F4; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px;">V&amp;</div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <div class="display" style="font-weight: 800; font-size: 20px;">Vella &amp; Co.</div>
        <div style="font-size: 12px; color: #A19A94;">mid · performance</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px;"><div style="padding: 6px 14px; border: 1px solid #3A363E; border-radius: 999px; font-size: 13px; font-weight: 600; color: #CFC9C3;">Send playtest file</div><div style="font-size: 11px; color: #8A847E;">on the playtest link only</div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 30px 32px; border: 1px solid #2A272D; border-radius: 24px; background: #17161A;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8A847E;">{{eyebrow}}</div>
      <div class="display" style="font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.02em;">{{title}}</div>
      <div style="display: flex; gap: 6px;"><sc-for list="{{dots}}" as="d" hint-placeholder-count="12"><div style="width: 12px; height: 12px; border: 1.5px solid {{d.border}}; border-radius: 50%; box-sizing: border-box; background: {{d.bg}};"></div></sc-for></div>
      <sc-if value="{{restoring}}" hint-placeholder-val="{{false}}"><div style="height: 8px; border-radius: 4px; background: #2E2A33; overflow: hidden;"><div style="height: 100%; width: {{barWidth}}; background: #D7262F;"></div></div></sc-if>
      <sc-if value="{{hasCount}}" hint-placeholder-val="{{true}}"><div class="num" style="font-size: 14px; color: #A19A94; margin-top: -8px;">{{count}}</div></sc-if>
      <sc-if value="{{hasNote}}" hint-placeholder-val="{{true}}"><div style="font-size: 15px; line-height: 1.55; color: #CFC9C3;">{{note}}</div></sc-if>
      <sc-if value="{{hasRows}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr); gap: 8px 16px; padding: 14px 16px; border: 1px solid #2A272D; border-radius: 16px; background: #0D0C0E; font-size: 13px;">
            <div></div><div style="color: #8A847E; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;">when saved</div><div style="color: #8A847E; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;">replayed now</div>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div style="color: #A19A94;">{{r.week}}</div><div class="num" style="color: #CFC9C3;">{{r.then}}</div><div class="num" style="color: #EDE8E3; font-weight: 700;">{{r.now}}</div></sc-for>
            <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}"><div></div><div style="grid-column: 2 / -1; color: #A19A94;">{{more}}</div></sc-if>
          </div>
        </sc-if>
      <div style="display: flex; flex-direction: column; gap: 14px; padding-top: 4px;">
        <sc-if value="{{hasPrimary}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 16px;"><div style="height: 52px; padding: 0 28px; border-radius: 999px; background: #D7262F; color: #FFF5F4; display: inline-flex; align-items: center; font: 700 18px/1 'Bricolage Grotesque', sans-serif; white-space: nowrap;">{{primary}}</div><div style="font-size: 13px; line-height: 1.4; color: #A19A94;">{{primaryWhy}}</div></div>
        </sc-if>
        <sc-if value="{{hasSecondary}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 16px;"><div style="height: 44px; padding: 0 22px; border: 1px solid #3A363E; border-radius: 999px; color: #CFC9C3; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; white-space: nowrap;">{{secondary}}</div><div style="font-size: 13px; line-height: 1.4; color: #A19A94;">{{secondaryWhy}}</div></div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
/*
 * The switch-over, A · the front door on its own. Words are the game's own where it has them
 * (ui/app.js offerResume and resume); the figures are a real save's, made on the
 * live site's code and replayed on F17's branch.
 */
const STATES = {"offer":{"label":"Resume offer","eyebrow":"saved in this browser","title":"A game in progress","played":6,"replayed":null,"count":"6 of 12 weeks played","note":"Resuming replays those weeks from your own decisions, which takes a few seconds.","primary":"Resume at week 7","primaryWhy":"Everything as you left it, except changes you had staged and not yet run.","secondary":"Start a new game","secondaryWhy":"Discards the saved game. There is no getting it back.","trayNote":"A game saved in this browser: 6 of 12 weeks played."},"restoring":{"label":"Restoring","eyebrow":"saved in this browser","title":"Restoring your game","played":6,"replayed":3,"count":"Replaying week 4 of 6…","note":"","primary":"","primaryWhy":"","secondary":"","secondaryWhy":"","trayNote":""},"changed":{"label":"Game has changed","eyebrow":"saved in this browser","title":"This game has changed since you saved it","played":6,"replayed":null,"count":"","note":"The simulator has been updated since this game was saved. Replayed on this version, your own decisions produce different weeks from the ones you played, so the numbers you would see are this version’s, not the ones you read at the time.","rows":[{"week":"Week 1","then":"₹55,939 on 4,284 clicks","now":"₹78,247 on 6,536 clicks"},{"week":"Week 2","then":"₹78,250 on 3,400 clicks","now":"₹78,245 on 4,856 clicks"},{"week":"Week 3","then":"₹78,250 on 3,352 clicks","now":"₹78,247 on 5,617 clicks"}],"more":"and 3 more weeks differ","primary":"Continue with these numbers","primaryWhy":"Carry on from here on the updated simulator.","secondary":"Start a new game","secondaryWhy":"Discards the saved game.","trayNote":"Replayed on this version, the weeks came out different."},"error":{"label":"Could not restore","eyebrow":"saved in this browser","title":"This version cannot open your saved game","played":6,"replayed":null,"count":"","note":"Opening it fails on this version, and would fail the same way every time. It stays in this browser until you start a new game, so a later version may open it.","primary":"Start a new game","primaryWhy":"Discards the saved game.","secondary":"","secondaryWhy":"","trayNote":"This version cannot open the saved game."},"finished":{"label":"Finished game","eyebrow":"saved in this browser","title":"A finished game","played":12,"replayed":null,"count":"12 of 12 weeks played","note":"Opening it replays the twelve weeks from your own decisions, which takes a few seconds.","primary":"Back to the results","primaryWhy":"The twelve weeks, what you learned, where they sat and everyone’s books.","secondary":"Start a new game","secondaryWhy":"Discards the saved game. There is no getting it back.","trayNote":"A finished game saved in this browser."}};
const ORDER = ['offer', 'restoring', 'changed', 'error', 'finished'];
const RED = '#D7262F';

class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { at: 'offer' };
  }

  renderVals() {
    const s = STATES[this.state.at];
    const { replayed, played, rows, ...words } = s;
    const dots = Array.from({ length: 12 }, (_, i) => {
      const done = i + 1 <= played;
      return { bg: done ? RED : 'transparent', border: done ? RED : '#3A363E' };
    });
    return {
      states: ORDER.map((key) => ({
        label: STATES[key].label,
        color: key === this.state.at ? '#EDE8E3' : '#8A847E',
        border: key === this.state.at ? '#CFC9C3' : '#3A363E',
        pick: () => this.setState({ at: key }),
      })),
      ...words,
      dots,
      hasCount: Boolean(s.count),
      hasNote: Boolean(s.note),
      hasRows: Boolean(rows),
      rows: rows ?? [],
      more: s.more ?? '',
      hasMore: Boolean(s.more),
      hasPrimary: Boolean(s.primary),
      hasSecondary: Boolean(s.secondary),
      restoring: replayed !== null,
      barWidth: replayed !== null ? `${(100 * replayed) / played}%` : '0%',
      topWeek: `Week ${played} of 12`,
    };
  }
}

</script>
</body>
</html>
